version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    depends_on:
      - db

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: successc_lms_dev
    volumes:
      - db-data:/var/lib/mysql
      - ../database/codespace-init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"

volumes:
  db-data:
